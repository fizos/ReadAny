name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - codex/readany-v1.3.6-fix-macos-arm64

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/app/src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Apple Silicon DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >-
          pnpm --filter app tauri build
          --target aarch64-apple-darwin
          --bundles dmg
          --ci
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReadAny-1.3.6-macos-arm64
          if-no-files-found: error
          path: |
            packages/app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            packages/app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
