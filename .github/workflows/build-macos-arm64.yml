name: Build macOS Apple Silicon

on:
  workflow_dispatch:
  push:
    branches:
      - codex/readany-v1.3.6-fix-macos-arm64

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS arm64
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/app/src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify reader regressions
        run: pnpm --filter app exec vitest run --config vitest.reader.config.ts

      - name: Build Apple Silicon DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >-
          pnpm --filter app tauri build
          --target aarch64-apple-darwin
          --bundles app,dmg
          --ci
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify and package Apple Silicon app
        shell: bash
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/packages/app/src-tauri/target/aarch64-apple-darwin/release/bundle"
          app="$bundle/macos/ReadAny.app"
          binary="$app/Contents/MacOS/app"
          test -f "$binary"
          test "$(lipo -archs "$binary")" = "arm64"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" artifacts/ReadAny_1.3.6_v21_macos_arm64.app.zip
          for dmg in "$bundle"/dmg/*.dmg; do
            hdiutil verify "$dmg"
            cp "$dmg" artifacts/
          done
          {
            printf 'source_commit=%s\narchitecture=arm64\nsigning=ad-hoc\nnotarized=false\n' "$GITHUB_SHA"
            printf 'high_fidelity_pdf=windows-only\n'
            shasum -a 256 "$binary"
            shasum -a 256 artifacts/*.dmg artifacts/*.app.zip
          } > artifacts/build-manifest.txt

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReadAny-1.3.6-macos-arm64
          if-no-files-found: error
          path: artifacts/*
